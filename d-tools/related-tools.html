<!--
  Reusable cross-link component for the d-tools pages.
  Load it the same way as header.html / email-capture.html, e.g.:
      $('#related-tools-con').load("related-tools.html");
  Lives in /d-tools/, so the relative links below resolve correctly from any tool page.
  Self-contained styles (no Tailwind/Bootstrap dependency) so it renders on every tool.

  Shows a curated set of (max 3) related tools that changes per page.
  To tune what each page links to, edit the RELATED map below.
  Pages not in the map fall back to the first three other tools.
-->
<section class="dtools-related" aria-label="More free design and startup tools">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
  <style>
    .dtools-related{max-width:1120px;margin:120px auto 80px;padding:0 20px;font-family:'Rubik',sans-serif;}
    .dtools-related .dtools-panel{position:relative;overflow:hidden;isolation:isolate;border-radius:24px;padding:44px 40px 34px;color:#fff;
      background:radial-gradient(700px 340px at 100% 0%,rgba(0,157,255,.28),transparent 60%),radial-gradient(520px 300px at 0% 100%,rgba(36,84,230,.32),transparent 60%),#0a1430;
      box-shadow:0 40px 70px -40px rgba(10,20,48,.7);}
    .dtools-related .dtools-panel::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;
      background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:44px 44px;
      -webkit-mask-image:radial-gradient(ellipse at 80% 10%,#000,transparent 70%);mask-image:radial-gradient(ellipse at 80% 10%,#000,transparent 70%);}
    .dtools-related .dtools-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:28px;}
    .dtools-related .dtools-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#ffd23f;margin-bottom:10px;}
    .dtools-related h2{font-family:'Archivo','Rubik',sans-serif;font-stretch:105%;font-weight:780;font-size:clamp(1.7rem,3.4vw,2.35rem);line-height:1.04;letter-spacing:-.02em;color:#fff;margin:0;}
    .dtools-related h2 em{font-style:normal;color:#ffd23f;}
    .dtools-related .dtools-sub{color:rgba(255,255,255,.68);margin:10px 0 0;font-size:1rem;line-height:1.5;max-width:520px;}
    .dtools-related .dtools-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
    @media (max-width:820px){.dtools-related .dtools-grid{grid-template-columns:1fr;}}
    .dtools-related .dtools-card{position:relative;display:flex;flex-direction:column;height:100%;padding:22px 22px 18px;border-radius:16px;text-decoration:none;color:#fff;
      background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);
      transition:transform .3s cubic-bezier(.2,.8,.2,1),border-color .3s ease,background .3s ease,box-shadow .3s ease;}
    .dtools-related .dtools-card:hover,.dtools-related .dtools-card:focus-visible{transform:translateY(-5px);border-color:rgba(255,210,63,.55);text-decoration:none;color:#fff;
      background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));box-shadow:0 24px 40px -22px rgba(0,0,0,.8),0 0 0 1px rgba(255,210,63,.15),0 0 40px -10px rgba(255,210,63,.25);}
    .dtools-related .dtools-card:focus-visible{outline:3px solid #ffd23f;outline-offset:3px;}
    .dtools-related .dtools-ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;margin-bottom:18px;font-size:1.3rem;
      color:#4dbbff;background:rgba(0,157,255,.14);box-shadow:inset 0 0 0 1px rgba(0,157,255,.3);
      transition:transform .35s cubic-bezier(.2,.8,.2,1),background .25s ease,color .25s ease,box-shadow .25s ease;}
    .dtools-related .dtools-ico i{line-height:1!important;}
    .dtools-related .dtools-card:hover .dtools-ico,.dtools-related .dtools-card:focus-visible .dtools-ico{background:#ffd23f;color:#0a1430;box-shadow:0 8px 20px -6px rgba(255,210,63,.6);transform:rotate(-6deg) scale(1.05);}
    .dtools-related .dtools-card h3{font-family:'Archivo','Rubik',sans-serif;font-stretch:105%;font-weight:720;font-size:1.18rem;line-height:1.2;letter-spacing:-.01em;color:#fff;margin:0 0 8px;}
    .dtools-related .dtools-card p{font-size:.93rem;color:rgba(255,255,255,.66);margin:0 0 18px;line-height:1.5;}
    .dtools-related .dtools-go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:#ffd23f;}
    .dtools-related .dtools-go i{transition:transform .25s cubic-bezier(.2,.8,.2,1);}
    .dtools-related .dtools-card:hover .dtools-go i{transform:translateX(4px);}
    .dtools-related .dtools-alllink a{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;font-weight:600;font-size:.95rem;color:#fff;text-decoration:none;
      padding:11px 18px;border-radius:12px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);transition:box-shadow .2s ease,color .2s ease;}
    .dtools-related .dtools-alllink a:hover,.dtools-related .dtools-alllink a:focus-visible{color:#ffd23f;box-shadow:inset 0 0 0 1.5px #ffd23f;text-decoration:none;}
    @media (max-width:560px){.dtools-related{margin:90px auto 60px;padding:0 12px;}.dtools-related .dtools-panel{padding:32px 20px 22px;border-radius:20px;}}
    @media (prefers-reduced-motion:reduce){.dtools-related *{transition:none!important;}}
  </style>

  <div class="dtools-panel">
    <div class="dtools-head">
      <div>
        <div class="dtools-eyebrow"><i class="fas fa-bolt" aria-hidden="true"></i> Keep going</div>
        <h2>More free design &amp; <em>startup tools</em></h2>
        <p class="dtools-sub">Interactive, no-signup tools to help you research, validate, and build better products.</p>
      </div>
      <div class="dtools-alllink">
        <a href="decision-tools.html">Browse all decision tools <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
      </div>
    </div>

    <div class="dtools-grid" id="dtools-grid"></div>
  </div>

  <script>
    (function () {
      // All tools, keyed by filename.
      var TOOLS = {
        "ux-maturity-assessment.html":  { icon: "fa-chart-line",  title: "UX Maturity Assessment",        desc: "Measure how user-centered your organization really is across 7 dimensions." },
        "ux-method-tree.html":          { icon: "fa-sitemap",     title: "UX Methods Tree",                desc: "Find the right research or design method for what you're trying to learn." },
        "design-system-readiness.html": { icon: "fa-cubes",       title: "Design System Readiness",        desc: "See whether your team is ready to invest in a design system yet." },
        "project-validation-methods.html": { icon: "fa-flask",    title: "Project Validation Methods",     desc: "Match your idea to the right validation method before you build." },
        "business-idea-generator.html": { icon: "fa-lightbulb",   title: "Business Idea Generator",        desc: "Filter 170+ business ideas by budget and skills, each with a test to run this week." },
        "entrepreneur-decision-tree.html": { icon: "fa-code-branch", title: "Entrepreneur Decision Tree",  desc: "Work through the key startup decisions one question at a time." },
        "founder-block.html":           { icon: "fa-hand-rock",   title: "Founder Blockers Diagnostic",    desc: "Find what's holding you back as a founder and get a concrete next step." },
        "AI-agent-idea-validation.html":{ icon: "fa-robot",       title: "AI Agent Idea Validation",       desc: "Reality-check your AI agent concept across user, market, and problem fit." },
        "drop-off-diagnostic.html":     { icon: "fa-filter",      title: "Drop-Off Diagnostic",            desc: "Find the stage where your product loses people and the most likely reason." }
      };

      // Curated, max-3 related set per page. Edit freely.
      var RELATED = {
        "ux-maturity-assessment.html":     ["ux-method-tree.html", "drop-off-diagnostic.html", "design-system-readiness.html"],
        "ux-method-tree.html":             ["drop-off-diagnostic.html", "ux-maturity-assessment.html", "project-validation-methods.html"],
        "design-system-readiness.html":    ["ux-maturity-assessment.html", "ux-method-tree.html", "project-validation-methods.html"],
        "project-validation-methods.html": ["ux-method-tree.html", "drop-off-diagnostic.html", "business-idea-generator.html"],
        "business-idea-generator.html":    ["entrepreneur-decision-tree.html", "AI-agent-idea-validation.html", "founder-block.html"],
        "entrepreneur-decision-tree.html": ["business-idea-generator.html", "founder-block.html", "project-validation-methods.html"],
        "founder-block.html":              ["entrepreneur-decision-tree.html", "business-idea-generator.html", "AI-agent-idea-validation.html"],
        "AI-agent-idea-validation.html":   ["business-idea-generator.html", "project-validation-methods.html", "entrepreneur-decision-tree.html"],
        "drop-off-diagnostic.html":        ["ux-method-tree.html", "ux-maturity-assessment.html", "project-validation-methods.html"]
      };

      var current = location.pathname.split("/").pop();
      var picks = RELATED[current];

      // Fallback for any page without a curated set: first 3 other tools.
      if (!picks) {
        picks = Object.keys(TOOLS).filter(function (f) { return f !== current; }).slice(0, 3);
      }

      var grid = document.getElementById("dtools-grid");
      grid.innerHTML = picks.slice(0, 3).map(function (f) {
        var t = TOOLS[f];
        if (!t) return "";
        return '<a class="dtools-card" href="' + f + '">' +
                 '<div class="dtools-ico"><i class="fas ' + t.icon + '" aria-hidden="true"></i></div>' +
                 '<h3>' + t.title + '</h3>' +
                 '<p>' + t.desc + '</p>' +
                 '<span class="dtools-go">Open tool <i class="fas fa-arrow-right" aria-hidden="true"></i></span>' +
               '</a>';
      }).join("");
    })();
  </script>
</section>
