<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="-60.86 -60.86 882.42 991.35"><defs><style>.cls-1,.cls-2{mix-blend-mode:multiply;}.cls-1,.cls-3{fill:#a1e5f8;}.cls-2{opacity:.5;}.cls-4{isolation:isolate;}.cls-5{fill:#77bdd7;}.cls-6{fill:#e2272d;}.cls-7{fill:#77bdd7;}.cls-8{opacity:.72;}.cls-8,.cls-9{fill:#ebffff;}.cls-10{fill:#2308b5;}.cls-11{fill:#e7abc5;}</style></defs><style id="animation">
/* Added by hand after the Illustrator export: re-exporting drops this block (and the padded
   viewBox, 8% of the width on each side, which the img tag cancels with width:116%;margin:-8%).
   Every top-level group except #blob is the lens assembly; they all share one motion and pivot
   on the lens centre. Intro 0-1.9s, loop from 2s. */
#blob{transform-box:fill-box;transform-origin:center;
  animation:blob-in 1.1s cubic-bezier(.3,.7,.4,1) both,breathe 7s ease-in-out 1.6s infinite}
#page-inspection>g:not(#blob){transform-box:view-box;transform-origin:340px 211px;
  animation:lens-in .9s cubic-bezier(.2,.9,.3,1.12) .4s both,scan 9s ease-in-out 2s infinite}
#page-inspection>g#hair-behind,#page-inspection>g#shirt,#page-inspection>g#head-neck,#page-inspection>g#hair-top,#page-inspection>g#nose,#page-inspection>g#eyeglasses-right,#page-inspection>g#eyeglasses-left,#page-inspection>g#mouth,#page-inspection>g#eye-left,#page-inspection>g#eye-right{animation:lens-in .9s cubic-bezier(.2,.9,.3,1.12) .4s both,scan 9s ease-in-out 2s infinite,focus .7s ease-out 1.1s both}
#eye-left path,#eye-right path{transform-box:fill-box;transform-origin:center;animation:blink 4.5s 2.4s infinite}
@keyframes blob-in{0%{transform:scale(0,0);opacity:0}30%{transform:scale(1.12,.9);opacity:1}48%{transform:scale(.92,1.08) rotate(-2deg)}66%{transform:scale(1.05,.97) rotate(1deg)}83%{transform:scale(.99,1.02)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes lens-in{0%{opacity:0;transform:translate(-220px,300px) rotate(-30deg)}100%{transform:none}}
@keyframes scan{0%,100%{transform:none}22%{transform:translate(55px,45px) rotate(4deg)}50%{transform:translate(85px,15px) rotate(2deg)}75%{transform:translate(20px,60px) rotate(-3deg)}}
@keyframes focus{0%{opacity:0;filter:blur(10px)}100%{opacity:1;filter:blur(0)}}
@keyframes blink{0%,6%,100%{transform:none}3%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
