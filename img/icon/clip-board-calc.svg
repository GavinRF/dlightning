<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="-61.57 -61.57 892.78 830.28"><defs><style>.cls-1{fill:#00b5d8;}.cls-2{mix-blend-mode:multiply;opacity:.5;}.cls-3{fill:#0032cc;}.cls-4{isolation:isolate;}.cls-5{fill:#2795ed;}.cls-6{fill:#77bdd7;}.cls-7{fill:#e2272d;}.cls-8{fill:#a1e5f8;}.cls-9{fill:#ebffff;}.cls-10{fill:#2308b5;}.cls-11{fill:#e7abc5;}</style></defs><style id="animation">
/* Added by hand after the Illustrator export: re-exporting drops this block, so copy it back in.
   Intro 0-2.3s, then a 4s loop starting at 2.4s. */
#blob-bg,#calculator,#calculator path,#pen,#arrow-head,#graph-bar,[id^=dotted-line]{transform-box:fill-box;transform-origin:center}
#blob-bg{animation:blob-in 1.1s cubic-bezier(.3,.7,.4,1) both,breathe 7s ease-in-out 1.6s infinite}
#clipboard{animation:rise-in .8s cubic-bezier(.2,.9,.3,1.15) .3s both}
#paper-bottom,#shadow-on-bottom-paper{animation:paper-in .7s cubic-bezier(.2,.8,.3,1) .75s both}
#middle-paper,#shadow-on-middle-paper{animation:paper-in .7s cubic-bezier(.2,.8,.3,1) .6s both}
#shadow-on-bottom-paper,#shadow-on-middle-paper{animation-name:shadow-in}
#calculator{transform-origin:50% 100%;animation:drop-in .7s cubic-bezier(.3,0,.3,1) .85s both}
#calculator-shadow{animation:shadow-in .3s ease-out 1.3s both}
#pen{animation:pen-in .7s cubic-bezier(.2,.9,.3,1.2) 1s both,float 4s ease-in-out 2.4s infinite}
#graph-bar{transform-origin:0 100%;animation:fade-in .4s ease-out 1.15s both}
[id^=dotted-line]{transform-origin:50% 100%;animation:grow-up .35s ease-out both}
#dotted-line-1{animation-delay:1.3s}#dotted-line-2{animation-delay:1.4s}
#dotted-line-3{animation-delay:1.5s}#dotted-line-4{animation-delay:1.6s}
#graph-key{animation:fade-in .4s ease-out 1.5s both}
#arrow-line{animation:draw .55s ease-in-out 1.45s both}
#arrow-head{transform-origin:0 100%;animation:pop .35s cubic-bezier(.3,1.6,.5,1) 1.95s both,nudge 4s ease-in-out 2.4s infinite}
#calculator path:nth-of-type(n+4){animation:press 4s 2.4s infinite}
#calculator path:nth-of-type(5){animation:none}
#calculator path:nth-of-type(7){animation-delay:2.75s}
#calculator path:nth-of-type(6){animation-delay:3.1s}
#calculator path:nth-of-type(8){animation-delay:3.5s}
@keyframes blob-in{0%{transform:scale(0,0);opacity:0}30%{transform:scale(1.12,.9);opacity:1}48%{transform:scale(.92,1.08) rotate(-2deg)}66%{transform:scale(1.05,.97) rotate(1deg)}83%{transform:scale(.99,1.02)}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes rise-in{0%{opacity:0;transform:translateY(200px)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes paper-in{0%{opacity:0;transform:translate(-110px,-70px)}40%{opacity:1}100%{transform:none}}
@keyframes shadow-in{0%{opacity:0;transform:translate(-110px,-70px)}100%{opacity:.5;transform:none}}
@keyframes drop-in{0%{opacity:0;transform:translateY(-260px)}55%{opacity:1;transform:translateY(0) scale(1)}70%{transform:scale(1.08,.9)}85%{transform:translateY(-12px) scale(.97,1.04)}100%{transform:none}}
@keyframes pen-in{0%{opacity:0;transform:translateY(-200px) rotate(25deg)}100%{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:none}50%{transform:translateY(-14px) rotate(-4deg)}}
@keyframes fade-in{0%{opacity:0}100%{opacity:1}}
@keyframes grow-up{0%{transform:scaleY(0)}100%{transform:none}}
@keyframes draw{0%{clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0)}}
@keyframes pop{0%{transform:scale(0)}100%{transform:none}}
@keyframes nudge{0%,38%,62%,100%{transform:none}48%{transform:translate(8px,-10px) scale(1.12)}}
@keyframes press{0%,9%,100%{transform:none;filter:none}3%{transform:scale(.8);filter:brightness(1.5)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
